version: '3.8'

services:
  nginx:
    image: nginx
    ports:
      - "8080:80"
    depends_on:
      - db
    networks:
      - app-net

  db:
    image: postgres:15
    restart: always
    environment:
      - POSTGRES_PASSWORD=secret
    networks:
      - app-net

networks:
  app-net:
    driver: bridge